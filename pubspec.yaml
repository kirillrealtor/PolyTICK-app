name: polytick_app
description: "PolyTICK - Track politician stock trades with 8 layers of intelligence."
publish_to: 'none'
version: 1.0.1+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # ── Routing ──
  go_router: ^14.8.1

  # ── Networking ──
  dio: ^5.7.0

  # ── Auth & Security ──
  flutter_secure_storage: ^9.2.4
  jwt_decoder: ^2.0.1

  # ── Payments ──
  flutter_stripe: ^11.3.0

  # ── Push Notifications ──
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4
  flutter_local_notifications: ^18.0.1

  # ── UI & Design ──
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  fl_chart: ^0.70.2
  confetti: ^0.7.0
  shimmer: ^3.0.0

  # ── Utilities ──
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  flutter_dotenv: ^5.2.1
  package_info_plus: ^8.3.0
  shared_preferences: ^2.5.3
  syncfusion_flutter_pdfviewer: ^33.2.13

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path_ios: "assets/images/PolyTICK-AppIcon-iOS.png"
  image_path_android: "assets/images/PolyTICK-NewLogo-transparent.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/PolyTICK-NewLogo-transparent.png"
  remove_alpha_ios: true
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/images/blog/
    - assets/images/politicians/
    - assets/images/favicon/
    - assets/politicians/
