workflows:
  ios-workflow:
    name: iOS App Store Release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: Magiccode-flutterIOS
    environment:
      flutter: default
      xcode: latest
      cocoapods: default
    scripts:
      - name: Fetch and create signing files from Apple
        script: |
          keychain initialize
          app-store-connect create-certificate --type IOS_DISTRIBUTION || true
          app-store-connect fetch-signing-files "PolyTICK.us.app" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Flutter build IPA and Export
        script: |
          flutter build ipa --release --no-codesign
          ARCHIVE_PATH=$(find build/ios/archive -name "*.xcarchive" | head -n 1)
          echo "Exporting archive from: $ARCHIVE_PATH"
          
          mkdir -p build/ios/ipa
          cat <<EOF > /Users/builder/export_options.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>teamID</key>
              <string>26D3D2G693</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath build/ios/ipa \
            -exportOptionsPlist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - hafiznoorulhassan987@gmail.com
        notify:
          success: true
          failure: true
